# Builds the site with Vite and publishes dist/ to GitHub Pages on every push to main.
#
# Today the live site serves the source tree as-is (115 requests and an import map to jsDelivr for
# the home page); the built site is 48 requests, tree-shaken, minified, with hashed file names.
# To turn this on: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then this workflow only builds (the deploy job is skipped when Pages is not enabled).
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
