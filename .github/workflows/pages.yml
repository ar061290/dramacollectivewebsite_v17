# Builds the site with Vite and publishes dist/ to GitHub Pages on every push to main.
#
# Today the live site serves the source tree as-is (115 requests and an import map to jsDelivr for
# the home page); the built site is 48 requests, tree-shaken, minified, with hashed file names.
# To turn this on: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then this workflow only builds: the deploy job runs only when the repository's Pages site is set
# to be published by GitHub Actions (a site published from a branch is left as it is).
#
# Field measurements (src/util/field.js, tools/field/README.md): the pages are written with the owner's
# receiver (a Google Apps Script web app, deployed 21 October 2026), or with the repository variable
# FIELD_ENDPOINT (Settings → Secrets and variables → Actions → Variables) where one is set; FIELD_SAMPLE
# is the share of visits that report (0.1 if unset). Only this deploy writes the endpoint in: a build on
# a machine of one's own (the lab's) carries none and sends nothing.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write the pages (with the field endpoint, if one is set)
        run: node tools/pages/build.mjs
        env:
          FIELD_ENDPOINT: ${{ vars.FIELD_ENDPOINT || 'https://script.google.com/macros/s/AKfycbwfUNFx4Wms8VBHr3G38L0rs-lg3QQ7pqmtSAZhjVyc0dRPmzGLAFebm53JPC6yZeSv/exec' }}
          FIELD_SAMPLE: ${{ vars.FIELD_SAMPLE }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Is the Pages site published by GitHub Actions?
        id: pages
        run: |
          resp=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/pages")
          kind=$(printf '%s' "$resp" | node -e "let s='';process.stdin.on('data',(d)=>{s+=d}).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).build_type||'none'))}catch(e){process.stdout.write('none')}})")
          echo "This repository's Pages site is published by: $kind"
          if [ "$kind" = workflow ]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
