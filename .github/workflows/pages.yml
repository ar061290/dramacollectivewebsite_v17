# Builds the site with Vite and publishes dist/ to GitHub Pages on every push to main.
#
# Today the live site serves the source tree as-is (115 requests and an import map to jsDelivr for
# the home page); the built site is 48 requests, tree-shaken, minified, with hashed file names.
# To turn this on: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then this workflow only builds: the deploy job runs only when the repository has a Pages site.
#
# Field measurements (src/util/field.js, tools/field/README.md): set the repository variable
# FIELD_ENDPOINT (Settings → Secrets and variables → Actions → Variables) to the receiver's address,
# and the pages are written with it; FIELD_SAMPLE is the share of visits that report (0.1 if unset).
# Without FIELD_ENDPOINT the pages carry no endpoint and nothing is sent.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write the pages (with the field endpoint, if one is set)
        run: node tools/pages/build.mjs
        env:
          FIELD_ENDPOINT: ${{ vars.FIELD_ENDPOINT }}
          FIELD_SAMPLE: ${{ vars.FIELD_SAMPLE }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Does the repository have a Pages site?
        id: pages
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GitHub answered $code for this repository's Pages site"
          if [ "$code" = 200 ]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
